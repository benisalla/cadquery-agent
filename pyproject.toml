[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cadquery-agent"
version = "0.2.0"
description = "Local iterative prompt-to-CadQuery studio for open-weight model servers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pillow>=10",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.18",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
cadquery-agent = "cadquery_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cadquery_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
